name: kairos
version: 0.4.0
description: >-
  Correlates your agent's own work patterns against your sleep. Hermes already
  knows when you were up at 3am wrestling a build, which makes it the one
  honest witness to it: not a bystander, the accomplice. Set
  your own bedtime — 02:30 is as valid as 22:00 — and it offers a wind-down at
  a clean stopping point, saves your place so stopping costs nothing, shifts
  the target for early starts, asks one question each morning, and reports only
  correlations the sample can support.
author: Gens AI
license: MIT
homepage: https://github.com/Gens-ai/Kairos
requires_hermes: ">=0.21"
provides_tools:
  - sleep_log
  - sleep_import
  - kairos_activity
  - kairos_report
  - kairos_guard
  - kairos_goal
  - kairos_commitment
  - kairos_winddown
  - kairos_checkin
  - kairos_wearable
  - kairos_ping
provides_hooks:
  - on_session_start
  - post_tool_call
  - pre_llm_call
  - pre_tool_call
